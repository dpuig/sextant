:root{--font-ui:-apple-system, BlinkMacSystemFont, "Segoe WPC", "Segoe UI", "Ubuntu", "Droid Sans", sans-serif;--font-mono:Menlo, Monaco, Consolas, "Droid Sans Mono", "Courier New", monospace;--font-icon:codicon}
@font-face{font-family:codicon;src:url(codicon.ttf)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--editor\.background);color:var(--foreground)}
body{font-family:var(--font-ui);font-size:13px;line-height:22px;padding:20px}
.ci{font-family:var(--font-icon);font-size:16px;line-height:16px;width:16px;height:16px;display:inline-block;text-align:center;vertical-align:middle;flex:none;-webkit-font-smoothing:antialiased;font-style:normal}
.glyph{display:block}
.mono{font-family:var(--font-mono)}
.ann{font:11px/16px var(--font-mono);color:var(--descriptionForeground)}
.cap{font:600 12px/18px var(--font-ui);color:var(--foreground);margin:0 0 6px}
.cap .ann{font-weight:400;margin-left:8px}
.grid{display:flex;gap:24px;align-items:flex-start;flex-wrap:nowrap}
.col{flex:none}
.stack{display:flex;flex-direction:column;gap:22px}
.th{color:var(--foreground);font-family:var(--font-ui)}
.gap-note{outline:1px dashed var(--editorWarning\.foreground);outline-offset:2px;position:relative}
.gap-tag{position:absolute;right:-2px;top:-18px;font:10px/14px var(--font-mono);color:var(--editorWarning\.foreground);background:var(--editor\.background);padding:0 4px;white-space:nowrap}
/* workbench */
.wb{display:flex;width:max-content;border:1px solid var(--contrastBorder);background:var(--sideBar\.background)}
.ab{width:48px;flex:none;background:var(--activityBar\.background);display:flex;flex-direction:column;align-items:center;border-right:1px solid var(--contrastBorder)}
.ab .it{width:48px;height:48px;display:flex;align-items:center;justify-content:center;color:var(--activityBar\.inactiveForeground);position:relative}
.ab .it .ci{font-size:24px;width:24px;height:24px;line-height:24px}
.ab .it.on{color:var(--activityBar\.foreground)}
.ab .it.on:before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--activityBar\.activeBorder)}
.ab .bdg{position:absolute;right:8px;bottom:8px;min-width:16px;height:16px;border-radius:8px;background:var(--activityBarBadge\.background);color:#fff;font-size:9px;line-height:16px;text-align:center;padding:0 4px;font-weight:600;border:1px solid var(--contrastBorder)}
.sb{background:var(--sideBar\.background);overflow:hidden;flex:none}
.ctitle{height:35px;display:flex;align-items:center;padding:0 8px 0 20px;font-size:11px;letter-spacing:.04em;color:var(--sideBarTitle\.foreground);text-transform:uppercase}
.ctitle .sp,.shead .sp{flex:1}
.shead{height:22px;display:flex;align-items:center;font-size:11px;font-weight:700;text-transform:uppercase;color:var(--sideBarTitle\.foreground);padding-right:8px;border-top:1px solid var(--contrastBorder)}
.shead .ci{margin:0 2px 0 2px}
.shead .acts{display:flex;gap:2px;color:var(--icon\.foreground)}
.shead .acts .ci,.ctitle .ci{color:var(--icon\.foreground)}
.shead .acts span.b{width:22px;height:22px;display:flex;align-items:center;justify-content:center;border-radius:5px}
.prog{height:2px;position:relative;overflow:hidden}
.prog:after{content:"";position:absolute;left:18%;width:28%;top:0;bottom:0;background:var(--progressBar\.background)}
.msg{padding:2px 12px 6px 22px;color:var(--foreground);font-size:13px;line-height:18px}
.row{height:22px;display:flex;align-items:center;white-space:nowrap;overflow:hidden;color:var(--foreground);border:1px solid transparent}
.row .tw{width:16px;height:16px;flex:none;color:var(--icon\.foreground)}
.row .ri{margin-right:6px}
.row .lbl{flex:none}
.row .desc{color:var(--descriptionForeground);font-size:.9em;margin-left:.5em;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.row.sel{background:var(--list\.activeSelectionBackground);color:var(--list\.activeSelectionForeground);border-color:var(--list\.focusOutline)}
.row.sel .desc{color:var(--list\.activeSelectionForeground);opacity:.85}
.row.hov{background:var(--list\.hoverBackground);border:1px dashed var(--contrastActiveBorder)}
.welcome{padding:6px 20px 10px;color:var(--foreground);font-size:13px;line-height:18px}
.welcome p{margin:0 0 12px}
.welcome .btn{max-width:260px}
.welcome a,.lnk{color:var(--textLink\.foreground);text-decoration:none}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;height:26px;padding:0 12px;border-radius:2px;background:var(--button\.background);color:var(--button\.foreground);border:1px solid var(--contrastBorder);font-size:13px;white-space:nowrap}
.btn.sec{background:var(--button\.secondaryBackground);color:var(--button\.secondaryForeground)}
.btn.inl{display:inline-flex}
.kb{font:11px/16px var(--font-ui);padding:0 4px;border-radius:3px;border:1px solid var(--descriptionForeground);color:var(--descriptionForeground);margin-left:4px;white-space:nowrap}
/* hover + menu */
.hover{background:var(--editorHoverWidget\.background);border:1px solid var(--editorHoverWidget\.border);color:var(--foreground);padding:4px 8px;font-size:13px;line-height:19px;white-space:pre;box-shadow:0 2px 8px var(--widget\.shadow);border-radius:3px}
.menu{background:var(--menu\.background);color:var(--menu\.foreground);border:1px solid var(--contrastBorder);box-shadow:0 2px 8px var(--widget\.shadow);padding:4px 0;border-radius:5px;font-size:13px;min-width:260px}
.menu .mi{height:26px;display:flex;align-items:center;padding:0 22px 0 26px;margin:0 4px;border-radius:3px;border:1px solid transparent}
.menu .mi .k{margin-left:auto;padding-left:24px;opacity:.85;font-size:12px}
.menu .mi.on{background:var(--menu\.selectionBackground);color:var(--menu\.selectionForeground);border-color:var(--contrastActiveBorder)}
.menu .sepr{height:1px;margin:4px 0;background:var(--menu\.separatorBackground)}
/* status bar */
.stb{height:22px;display:flex;align-items:stretch;background:var(--statusBar\.background);color:var(--statusBar\.foreground);border-top:1px solid var(--statusBar\.border);font-size:12px;line-height:22px;white-space:nowrap}
.stb .si{display:flex;align-items:center;gap:4px;padding:0 5px}
.stb .si .ci{font-size:14px;width:14px;height:14px;line-height:14px}
.stb .crit{background:var(--statusBarItem\.errorBackground);color:var(--statusBarItem\.errorForeground);outline:1px solid var(--contrastActiveBorder);outline-offset:-1px;font-weight:600}
.stb .fill{flex:1}
/* widgets */
.widget{background:var(--editorWidget\.background);color:var(--foreground);border:1px solid var(--contrastBorder);box-shadow:0 0 8px 2px var(--widget\.shadow);border-radius:6px}
.qp{width:600px;padding:6px 0 6px}
.qp .qt{height:24px;margin:-6px 0 6px;background:var(--quickInputTitle\.background);border-radius:6px 6px 0 0;display:flex;align-items:center;padding:0 6px;font-size:13px;gap:6px}
.qp .qt .t{flex:1;text-align:center}
.qp .inp{margin:0 6px 6px;height:26px;background:var(--input\.background);border:1px solid var(--input\.border);display:flex;align-items:center;padding:0 6px;border-radius:2px;outline:1px solid var(--focusBorder);outline-offset:-1px}
.qp .inp .ph{color:var(--descriptionForeground)}
.qp .inp .cnt{margin-left:auto;font-size:11px;color:var(--descriptionForeground)}
.qp .vm{margin:-6px 6px 6px;padding:4px 6px;font-size:12px;line-height:17px;border:1px solid var(--inputValidation\.infoBorder);background:var(--editorWidget\.background)}
.qp .vm.w{border-color:var(--inputValidation\.warningBorder)}
.qp .qr{height:22px;display:flex;align-items:center;padding:0 11px;margin:0 6px;gap:6px;border-radius:3px;border:1px solid transparent;white-space:nowrap;overflow:hidden}
.qp .qr.tall{height:44px;align-items:flex-start;padding-top:2px}
.qp .qr .d{color:var(--descriptionForeground);font-size:.9em;overflow:hidden;text-overflow:ellipsis}
.qp .qr .dt{color:var(--descriptionForeground);font-size:.9em;display:block;line-height:20px}
.qp .qr.on{background:var(--list\.activeSelectionBackground);color:var(--list\.activeSelectionForeground);border-color:var(--list\.focusOutline)}
.qp .qr.on .d,.qp .qr.on .dt{color:var(--list\.activeSelectionForeground)}
.qp .sep{display:flex;align-items:center;justify-content:flex-end;height:22px;margin:0 6px 0;padding:0 11px;color:var(--pickerGroup\.foreground);font-size:12px;border-top:1px solid var(--pickerGroup\.border)}
.qp .sep.first{border-top:0}
.qp .msgline{padding:4px 17px;color:var(--descriptionForeground);font-size:12px}
.toast{width:450px;background:var(--editorWidget\.background);border:1px solid var(--contrastBorder);box-shadow:0 0 8px 2px var(--widget\.shadow);border-radius:4px;padding:8px 8px 10px 8px;color:var(--foreground)}
.toast .tm{display:flex;gap:8px;align-items:flex-start;line-height:20px}
.toast .tm .ci{margin-top:2px}
.toast .ta{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-left:24px}
.toast .src{font-size:12px;color:var(--descriptionForeground)}
.toast .bs{display:flex;gap:8px}
.dlg{width:460px;padding:16px 16px 12px}
.dlg .dh{display:flex;gap:14px}
.dlg .dh .ci{color:var(--editorWarning\.foreground)}
.dlg h3{font-size:13px;font-weight:600;line-height:20px}
.dlg p{font-size:13px;line-height:20px;margin-top:4px}
.dlg .chk{display:flex;align-items:center;gap:8px;margin:14px 0 0 46px;font-size:13px}
.dlg .box{width:18px;height:18px;border:1px solid var(--checkbox\.border);background:var(--checkbox\.background);border-radius:3px}
.dlg .bar{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin-top:16px}
.dlg .bar .lnk{margin-right:auto;margin-left:46px;font-size:13px}
.dlg .btn.def{outline:1px solid var(--focusBorder);outline-offset:2px}
/* panel / terminal */
.panel{background:var(--panel\.background);border-top:1px solid var(--panel\.border);border:1px solid var(--contrastBorder);color:var(--terminal\.foreground)}
.ptabs{height:35px;display:flex;align-items:center;gap:20px;padding:0 10px;font-size:11px;text-transform:uppercase;color:var(--panelTitle\.inactiveForeground)}
.ptabs .on{color:var(--panelTitle\.activeForeground);border-bottom:1px solid var(--panelTitle\.activeBorder);line-height:26px}
.ptabs .sp{flex:1}
.pbody{display:flex;height:150px}
.term{flex:1;padding:4px 20px;font:12px/18px var(--font-mono);white-space:pre-wrap;color:var(--terminal\.foreground)}
.tlist{width:200px;border-left:1px solid var(--panel\.border);padding-top:2px}
.tlist .tr{height:22px;display:flex;align-items:center;gap:6px;padding:0 8px;font-size:13px;border:1px solid transparent;white-space:nowrap;overflow:hidden}
.tlist .tr.on{background:var(--list\.inactiveSelectionBackground);border-color:var(--contrastActiveBorder)}
.tlist .tr .d{color:var(--descriptionForeground);font-size:.9em}
.cur{display:inline-block;width:7px;height:15px;background:var(--terminal\.foreground);vertical-align:-3px}
/* editor-area pages */
.page{background:var(--editor\.background);color:var(--editor\.foreground);border:1px solid var(--contrastBorder)}
.etab{height:35px;display:flex;align-items:center;gap:6px;padding:0 10px;font-size:13px;background:var(--sideBar\.background);border-bottom:1px solid var(--contrastBorder)}
.etab .t{background:var(--editor\.background);height:35px;display:flex;align-items:center;gap:6px;padding:0 12px;border:1px solid var(--contrastActiveBorder);border-bottom:0}
