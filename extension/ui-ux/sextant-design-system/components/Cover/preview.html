<!doctype html><html><head><meta charset="utf-8"><style>*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--editor\.background);height:288px;overflow:hidden}
.wrap{position:relative;width:960px;height:288px;font-family:var(--font-ui)}
svg{position:absolute;left:0;top:0}
.b1{fill:var(--statusBar\.background)} .b2{fill:var(--activityBar\.background)} .b3{fill:var(--statusBarItem\.errorBackground)}
.b4{fill:var(--sextant\.env\.devForeground)} .b5{fill:var(--sextant\.env\.stagingForeground)}
.arc{fill:none;stroke:var(--activityBar\.foreground);stroke-width:1.6;stroke-linecap:round}
.arc2{fill:none;stroke:var(--foreground);stroke-width:1.6;stroke-linecap:round}
.t{position:absolute;left:44px;bottom:40px;max-width:440px}
h1{font-size:96px;line-height:.92;font-weight:600;color:var(--foreground);letter-spacing:-.01em}
p{font-size:14px;line-height:20px;color:var(--descriptionForeground);margin-top:12px}</style></head><body><div class="wrap"><svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">
<!-- blocks: statusBar.background 286x176 (11x22 row steps), activityBar.background 132x288 slab, statusBarItem.errorBackground 154x44, sextant.env.devForeground 66x44, sextant.env.stagingForeground 66x44
     arrangement: one tall slab at the right edge bleeding top and bottom, the status-bar blue as the main field, three 44px signal strips stacked under it like status items
     pattern: the sextant's own frame (literal motif): two radii, three concentric arcs and an index arm from one apex, in activityBar.foreground over the slab and foreground over the ground; chosen because the brand is a navigation instrument
     scales: heights in row-height (22px) multiples, widths in 22px steps, square corners (radius-button 2px) -->
<rect class="b1" x="508" y="0" width="320" height="176" rx="2"/>
<rect class="b2" x="828" y="0" width="132" height="288"/>
<rect class="b3" x="508" y="198" width="154" height="44" rx="2"/>
<rect class="b5" x="674" y="198" width="66" height="44" rx="2"/>
<rect class="b4" x="752" y="198" width="66" height="44" rx="2"/>
<path class="arc" d="M894 30 L 844.3 250.5"/>
<path class="arc" d="M894 30 L 943.7 250.5"/>
<path class="arc" d="M845.7 244.6 A 220 220 0 0 0 942.3 244.6"/>
<path class="arc" d="M855.3 201.7 A 176 176 0 0 0 932.7 201.7"/>
<path class="arc" d="M865.0 158.8 A 132 132 0 0 0 923.0 158.8"/>
<path class="arc" d="M894 30 L 911.9 251.3"/>
<circle class="arc" cx="894" cy="30" r="5"/>
</svg>
<div class="t"><h1>Sextant</h1><p>Every cluster at a glance. Production you can't mistake.</p></div></div></body></html>
