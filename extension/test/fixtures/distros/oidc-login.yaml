apiVersion: v1
kind: Config
contexts:
  - name: sso
    context: {cluster: c, user: oidc-user}
clusters:
  - name: c
    cluster: {server: "https://k8s.corp.example.com"}
users:
  - name: oidc-user
    user:
      exec:
        apiVersion: client.authentication.k8s.io/v1beta1
        command: kubectl
        args: [oidc-login, get-token, --oidc-issuer-url=https://sso.example.com]
