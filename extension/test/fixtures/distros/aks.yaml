apiVersion: v1
kind: Config
contexts:
  - name: aks-prod
    context: {cluster: aks-prod, user: clusterUser_rg_aks-prod}
clusters:
  - name: aks-prod
    cluster: {server: "https://aks-prod-dns-1a2b3c4d.hcp.westeurope.azmk8s.io:443", certificate-authority-data: Zm9v}
users:
  - name: clusterUser_rg_aks-prod
    user:
      exec:
        apiVersion: client.authentication.k8s.io/v1beta1
        command: kubelogin
        args: [get-token, --login, devicecode, --server-id, abc]
