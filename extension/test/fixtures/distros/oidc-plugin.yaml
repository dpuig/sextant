apiVersion: v1
kind: Config
contexts:
  - name: sso2
    context: {cluster: c, user: u}
clusters:
  - name: c
    cluster: {server: "https://k8s2.corp.example.com"}
users:
  - name: u
    user:
      exec:
        apiVersion: client.authentication.k8s.io/v1beta1
        command: /usr/local/bin/kubectl-oidc_login
        args: [get-token]
