# Shipped empty so the agent's Role can be limited to get/update on this one
# name; the agent fills in `data`. Helm never sets `data`, so upgrades leave
# the agent's credentials alone, and `keep` stops uninstall from deleting them.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sextant-agent.credentialsSecret" . }}
  labels: {{- include "sextant-agent.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
{{- if and .Values.registration.token (not .Values.registration.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sextant-agent.tokenSecret" . }}
  labels: {{- include "sextant-agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ .Values.registration.token | quote }}
{{- end }}
{{- if .Values.serverCA }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sextant-agent.fullname" . }}-ca
  labels: {{- include "sextant-agent.labels" . | nindent 4 }}
data:
  ca.crt: |
    {{- .Values.serverCA | nindent 4 }}
{{- end }}
