name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  dco:
    # Every commit in a pull request must carry a Signed-off-by trailer (see CONTRIBUTING.md).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check sign-offs
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          fail=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            if ! git log -1 --format=%B "$sha" | grep -qE '^Signed-off-by: .+ <.+@.+>$'; then
              echo "::error::commit $sha is missing a Signed-off-by line (git commit -s)"; fail=1
            fi
          done
          exit $fail
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      SEXTANT_TEST_PG_DSN: postgres://postgres:test@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make build
      - run: make test
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.11

  e2e:
    # Phase 0 exit gates against two kind clusters (G1 install, G2 restart, G3 kubectl through the tunnel).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: helm/kind-action@v1
        with:
          install_only: true   # the test creates its own two clusters
      - run: make e2e CONTAINER=docker

  extension:
    # The VS Code extension (extension/): build, types, lint, unit tests, packaging, and a real VS Code at the engine floor.
    # Three operating systems: path, shell and file-permission behaviour differ, and bound terminals depend on all three.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # What ships to users must be clean. Dev-tool advisories are reviewed by hand (see the plan's Task 1 notes).
      - run: npm audit --omit=dev --audit-level=high
        if: runner.os == 'Linux'
      - run: npm run package
        if: runner.os == 'Linux'
      - run: xvfb-run -a npm run test:integration
        if: runner.os == 'Linux'
      - run: npm run test:integration
        if: runner.os != 'Linux'
